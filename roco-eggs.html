<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>破壳梦 · 谁在破壳</title>
<meta name="description" content="破壳梦——洛克王国谁在破壳？输入蛋的属性数据，预测可能破壳的精灵种类。"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#fdbf3a;--gold-dark:#8B6000;--bg-deep:#04091f;--bg-panel:rgba(6,14,38,0.82);
  --border:rgba(40,80,140,0.5);--text-dim:rgba(255,255,255,0.5);--text-bright:#e8e8e8;
}
body{
  min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg-deep);color:var(--text-bright);overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(66,70,226,0.12),transparent),
             radial-gradient(ellipse 50% 40% at 20% 80%,rgba(253,191,58,0.05),transparent),
             radial-gradient(ellipse 50% 40% at 80% 20%,rgba(79,195,247,0.04),transparent);
}

/* Header */
header{
  position:relative;z-index:50;display:flex;align-items:center;padding:0 2rem;
  height:56px;background:linear-gradient(180deg,rgba(4,12,40,0.88),rgba(4,12,35,0.72));
  border-bottom:1px solid rgba(253,191,58,0.18);backdrop-filter:blur(12px);
  box-shadow:0 2px 20px rgba(0,0,0,0.4),0 1px 0 rgba(253,191,58,0.08);
}
.header-inner{max-width:1400px;margin:0 auto;width:100%;display:flex;align-items:center;gap:1.5rem}
.brand{display:flex;align-items:center;gap:0.5rem;margin-right:2rem}
.brand-emoji{font-size:1.6rem;filter:drop-shadow(0 0 8px rgba(253,191,58,0.5))}
.brand span{font-size:1.15rem;font-weight:900;color:var(--gold);letter-spacing:0.08em;
  text-shadow:0 0 16px rgba(253,191,58,0.5),2px 2px 0 rgba(120,80,0,0.5);white-space:nowrap}
.header-divider{width:1px;height:22px;background:rgba(253,191,58,0.2);flex-shrink:0}
nav{display:flex;gap:1.5rem;align-items:center}
.nav-link{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;font-weight:600;
  letter-spacing:0.06em;transition:color 0.2s;cursor:pointer;background:none;border:none;padding:0}
.nav-link:hover,.nav-link.active{color:var(--gold)}
.version-badge{position:fixed;bottom:12px;right:16px;z-index:50;
  color:rgba(255,255,255,0.25);font-size:10px;font-family:monospace;pointer-events:none}

/* Main */
main{position:relative;z-index:10;max-width:1400px;margin:0 auto;min-height:calc(100vh - 56px);padding:1.5rem}
.page{display:none}.page.active{display:block}

/* Home Layout */
.home-layout{display:flex;gap:2.5rem;justify-content:center;align-items:flex-start}
.left-panel{width:320px;flex-shrink:0}
.center-panel{flex:1;display:flex;align-items:center;justify-content:center;min-height:400px}
.right-panel{width:320px;flex-shrink:0}

/* Title */
.page-title{text-align:center;margin-bottom:1.5rem}
.page-title h1{font-size:clamp(1.4rem,5vw,2.8rem);font-weight:900;color:var(--gold);
  text-shadow:3px 3px 0 var(--gold-dark),0 0 30px rgba(253,191,58,0.3);letter-spacing:0.05em}
.page-title p{color:var(--text-dim);font-size:clamp(0.8rem,2.5vw,1rem);margin-top:0.4rem;font-weight:700}

/* Input Cards */
.input-card{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;backdrop-filter:blur(12px)
}
.input-label{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.input-icon-badge{font-size:1.1rem}
.input-label-text{font-size:0.78rem;font-weight:700;color:rgba(255,255,255,0.55);letter-spacing:0.06em}
.input-field{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(40,80,140,0.4);
  border-radius:10px;padding:10px 12px;color:#fff;font-size:0.9rem;outline:none;transition:border 0.2s
}
.input-field:focus{border-color:var(--gold)}

/* Chips */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{
  padding:5px 14px;border-radius:999px;font-size:0.74rem;font-weight:700;cursor:pointer;
  border:1.5px solid rgba(255,255,255,0.18);background:rgba(18,18,28,0.88);color:#bbb;
  transition:all 0.18s
}
.chip:hover{border-color:rgba(253,191,58,0.5);color:#ddd}
.chip.selected{border-color:var(--gold);background:linear-gradient(180deg,rgba(253,191,58,0.22),rgba(253,191,58,0.1));
  color:var(--gold);box-shadow:0 0 8px rgba(253,191,58,0.35)}

/* Button */
.btn-hatch{
  width:100%;padding:12px;margin-top:12px;background:linear-gradient(180deg,#fdbf3a,#e5a820);
  color:#1A0A00;border:none;border-radius:12px;font-size:0.95rem;font-weight:900;
  letter-spacing:0.08em;cursor:pointer;transition:all 0.2s;
  box-shadow:0 4px 16px rgba(253,191,58,0.3)
}
.btn-hatch:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 24px rgba(253,191,58,0.45)}
.btn-hatch:disabled{background:rgba(253,191,58,0.25);color:rgba(253,191,58,0.4);box-shadow:none;cursor:not-allowed}

/* Egg display (emoji) */
.egg-display{text-align:center}
.egg-display .egg-emoji{font-size:clamp(80px,20vw,180px);display:block;animation:egg-float 3s ease-in-out infinite}
@keyframes egg-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* Results */
.results-title{margin-bottom:1rem}
.results-title-zh{font-size:0.85rem;font-weight:900;color:var(--gold);letter-spacing:0.08em}
.results-list{display:flex;flex-direction:column;gap:8px}
.result-card{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;backdrop-filter:blur(12px);transition:all 0.2s;cursor:default
}
.result-card:hover{border-color:rgba(253,191,58,0.4);transform:translateX(4px)}
.result-card.top1{border-color:rgba(253,191,58,0.6);box-shadow:0 0 20px rgba(253,191,58,0.15)}
.result-name{font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:4px}
.result-prob{font-size:0.85rem;font-weight:700;color:rgba(255,255,255,0.7)}
.result-bar{height:4px;border-radius:2px;margin-top:6px;transition:width 0.5s}
.conf-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:0.65rem;font-weight:800}
.conf-locked{background:rgba(253,191,58,0.2);color:var(--gold)}
.conf-high{background:rgba(79,195,247,0.15);color:#4fc3f7}

/* Status */
.server-status{font-size:0.7rem;color:var(--text-dim);text-align:center;margin-top:8px;font-family:monospace}
.server-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;background:#4caf50}

/* History */
.history-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:rgba(6,14,38,0.55);border:1px solid rgba(253,191,58,0.35);
  border-radius:12px;cursor:pointer;color:rgba(255,255,255,0.6);font-size:0.75rem;font-weight:700;
  transition:all 0.15s;margin-top:8px
}
.history-btn:hover{border-color:var(--gold)}
.history-panel{display:none;margin-top:8px}
.history-panel.open{display:block}
.history-item{
  background:rgba(6,14,38,0.55);border:1px solid rgba(40,80,140,0.3);border-radius:10px;
  padding:8px 12px;margin-bottom:4px;font-size:0.72rem;display:flex;justify-content:space-between;align-items:center
}

/* Data Table */
.data-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.data-table th{
  padding:10px 12px;background:rgba(253,191,58,0.1);border-bottom:2px solid rgba(253,191,58,0.3);
  color:var(--gold);font-weight:800;text-align:left;cursor:pointer;white-space:nowrap
}
.data-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.data-table tr:hover td{background:rgba(255,255,255,0.03)}
.data-table .size-bar,.data-table .weight-bar{display:inline-block;height:4px;border-radius:2px;vertical-align:middle}
.search-input{
  background:rgba(10,18,50,0.8);border:1.5px solid rgba(40,80,140,0.6);border-radius:10px;
  padding:7px 12px;color:#fff;font-size:0.82rem;outline:none;width:200px
}
.search-input:focus{border-color:var(--gold)}
select.search-input{appearance:none;cursor:pointer}

/* Responsive */
@media(max-width:1024px){
  .home-layout{flex-direction:column;align-items:center}
  .left-panel,.right-panel{width:100%;max-width:400px}
  .center-panel{width:100%;min-height:200px}
  nav{gap:0.75rem}.nav-link{font-size:0.75rem}
  header{padding:0 1rem}
}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;
  background:rgba(244,67,54,0.95);color:#fff;padding:10px 24px;border-radius:10px;
  font-size:0.85rem;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,0.4);display:none
}
.toast.show{display:block;animation:fade-up 0.3s ease-out}

@keyframes fade-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-up{animation:fade-up 0.5s ease-out}

/* Mobile tabs */
.mobile-tabs{display:none}
@media(max-width:768px){
  .desktop-nav{display:none}
  .mobile-tabs{display:flex;justify-content:center;gap:4px;margin-bottom:1rem}
  .mobile-tab{padding:8px 20px;border-radius:999px;font-size:0.78rem;font-weight:800;border:none;cursor:pointer;
    background:rgba(6,14,38,0.7);color:rgba(255,255,255,0.4);transition:all 0.2s}
  .mobile-tab.active{background:var(--gold);color:#1A0A00}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-emoji">🥚</span>
      <span>破壳梦</span>
    </div>
    <div class="header-divider"></div>
    <nav class="desktop-nav">
      <button class="nav-link active" data-page="home">谁在破壳</button>
      <button class="nav-link" data-page="rideable">精灵图鉴</button>
    </nav>
  </div>
</header>

<div class="mobile-tabs">
  <button class="mobile-tab active" data-page="home">谁在破壳</button>
  <button class="mobile-tab" data-page="rideable">精灵图鉴</button>
</div>

<main>

<!-- ========== 谁在破壳 ========== -->
<div class="page active" id="page-home">
  <div class="page-title">
    <h1>谁在破壳</h1>
    <p>输入蛋的数据，揭晓可能的精灵</p>
  </div>
  <div class="home-layout">
    <div class="left-panel">
      <div class="input-card">
        <div class="input-label"><div class="input-icon-badge">📏</div><span class="input-label-text">蛋的尺寸（m）</span></div>
        <input type="number" id="input-size" step="0.01" min="0.01" max="1.0" placeholder="尺寸 0.01 ~ 1.0" class="input-field">
      </div>
      <div class="input-card">
        <div class="input-label"><div class="input-icon-badge">⚖️</div><span class="input-label-text">蛋的重量（kg）</span></div>
        <input type="number" id="input-weight" step="0.01" min="0.01" max="100" placeholder="重量 0.01 ~ 100" class="input-field">
      </div>
      <div class="input-card">
        <div class="input-label-text" style="margin-bottom:8px">示例快填：</div>
        <div class="chip-row">
          <button class="chip" onclick="fillExample('粉星仔')">粉星仔</button>
          <button class="chip" onclick="fillExample('电咩咩')">电咩咩</button>
          <button class="chip" onclick="fillExample('雪豆丁')">雪豆丁</button>
          <button class="chip" onclick="fillExample('小独角兽')">小独角兽</button>
          <button class="chip" onclick="fillExample('恶魔狼')">恶魔狼</button>
          <button class="chip" onclick="fillExample('小狮鹫')">小狮鹫</button>
        </div>
      </div>
      <div class="input-card">
        <div class="input-label-text" style="margin-bottom:8px">来源</div>
        <div class="chip-row" id="source-chips">
          <button class="chip selected" data-source="any">不限</button>
          <button class="chip" data-source="magic">✨ 神奇的蛋</button>
          <button class="chip" data-source="shiny">🌈 炫彩精灵蛋</button>
          <button class="chip" data-source="season_shiny">🏆 赛季炫彩精灵蛋</button>
        </div>
      </div>
      <button class="btn-hatch" id="btn-predict" disabled onclick="predict()">开始推测</button>
      <div class="server-status" id="server-status">
        <span class="dot"></span>就绪 · 共 <span id="total-species">0</span> 个物种 · <span id="total-data">0</span> 条数据
      </div>
      <button class="history-btn" onclick="toggleHistory()">
        <span>历史记录</span><span>▼</span>
      </button>
      <div class="history-panel" id="history-panel"></div>
    </div>
    <div class="center-panel">
      <div class="egg-display" id="egg-display">
        <span class="egg-emoji">🥚</span>
        <p style="text-align:center;margin-top:1rem;color:#888;font-weight:700;letter-spacing:0.15em">等待数据输入...</p>
      </div>
    </div>
    <div class="right-panel" id="results-panel">
      <div class="results-title"><p class="results-title-zh">可能孵化的精灵与概率</p></div>
      <div id="results-container" style="display:flex;align-items:center;justify-content:center;min-height:360px;opacity:0.45">
        <div style="font-size:5rem;opacity:0.6">📭</div>
      </div>
    </div>
  </div>
</div>

<!-- ========== 精灵图鉴 ========== -->
<div class="page" id="page-rideable">
  <div class="page-title"><h1>精灵图鉴 · 蛋数据</h1></div>
  <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
    <input type="text" class="search-input" id="species-search" placeholder="搜索精灵..." oninput="renderTable()">
    <select class="search-input" style="width:170px" id="size-filter" onchange="renderTable()">
      <option value="all">所有尺寸</option>
      <option value="small">小型 &lt; 0.20 m</option>
      <option value="medium">中型 0.20–0.35 m</option>
      <option value="large">大型 0.35–0.50 m</option>
      <option value="xlarge">超大 &gt; 0.50 m</option>
    </select>
    <span style="font-size:0.72rem;color:var(--text-dim);white-space:nowrap">共 <span id="species-count">0</span> 种</span>
  </div>
  <div style="overflow-x:auto">
    <table class="data-table" id="species-table">
      <thead>
        <tr>
          <th onclick="sortTable('name')">精灵名称 ▾</th>
          <th onclick="sortTable('s_mean')">平均尺寸(m) ▾</th>
          <th onclick="sortTable('w_mean')">平均重量(kg) ▾</th>
          <th onclick="sortTable('n')">数据量 ▾</th>
          <th>尺寸范围</th>
          <th>重量范围</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

</main>

<div class="version-badge">数据来源 roco-eggs.tsuki-world.com</div>
<div class="toast" id="toast"></div>

// PREDICTION
function gaussianPDF(x, mean, std) {
  if (std <= 0) return 0;
  return Math.exp(-0.5 * Math.pow((x - mean) / std, 2)) / (std * Math.sqrt(2 * Math.PI));
}

function predict() {
  const sizeVal = parseFloat(document.getElementById('input-size').value);
  const weightVal = parseFloat(document.getElementById('input-weight').value);
  if (isNaN(sizeVal) || isNaN(weightVal)) { showToast('请输入有效的尺寸和重量'); return; }
  if (sizeVal < 0.01 || sizeVal > 1.0) { showToast('尺寸需在 0.01 ~ 1.0 m 之间'); return; }
  if (weightVal < 0.01 || weightVal > 100) { showToast('重量需在 0.01 ~ 100 kg 之间'); return; }

  let results = SPECIES_DATA.map(s => {
    const s_std = (s.s_max - s.s_min) / 4 || 0.005;
    const w_std = (s.w_max - s.w_min) / 4 || 0.05;
    const s_prob = gaussianPDF(sizeVal, s.s_mean, s_std);
    const w_prob = gaussianPDF(weightVal, s.w_mean, w_std);
    const score = Math.pow(s_prob, 0.6) * Math.pow(w_prob, 0.4);
    const adj = s.n > 100 ? 1 : s.n > 20 ? 0.7 : s.n > 5 ? 0.3 : 0.1;
    return { name: s.name, score: score * adj, n: s.n, s_mean: s.s_mean, w_mean: s.w_mean };
  });

  results.sort((a, b) => b.score - a.score);
  const maxScore = results[0].score;
  if (maxScore <= 0) { showToast('未找到匹配的精灵'); return; }
  results = results.filter(r => r.score / maxScore > 0.01).slice(0, 20);

  const totalScore = results.reduce((sum, r) => sum + r.score, 0);
  results = results.map(r => ({ ...r, prob: Math.round(r.score / totalScore * 10000) / 100 }));
  results = results.map((r, i) => {
    let conf;
    if (i === 0 && r.prob > 60) conf = 'locked';
    else if (i < 3 && r.prob > 15) conf = 'high';
    else conf = 'normal';
    return { ...r, conf };
  });

  renderResults(results, sizeVal, weightVal);
  addToHistory(sizeVal, weightVal, results[0]);
  document.getElementById('egg-display').innerHTML = `
    <span class="egg-emoji">✨</span>
    <p style="text-align:center;margin-top:0.5rem;color:var(--gold);font-weight:900;font-size:1.1rem">
      Top: ${results[0].name} (${results[0].prob}%)
    </p>
    <p style="text-align:center;color:var(--text-dim);font-size:0.75rem">
      尺寸: ${sizeVal}m · 重量: ${weightVal}kg
    </p>`;
}

function renderResults(results, sizeVal, weightVal) {
  const container = document.getElementById('results-container');
  container.style.opacity = '1';
  container.innerHTML = '<div class="results-list">' + results.map((r, i) => `
    <div class="result-card${i === 0 ? ' top1' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="display:flex;align-items:center;gap:8px">
          <span style="font-size:1.2rem;font-weight:900;color:var(--gold)">#${i + 1}</span>
          <span class="result-name">${r.name}</span>
          ${r.conf === 'locked' ? '<span class="conf-badge conf-locked">绝对锁定</span>' : ''}
          ${r.conf === 'high' ? '<span class="conf-badge conf-high">高潜目标</span>' : ''}
        </span>
        <span class="result-prob">${r.prob}%</span>
      </div>
      <div style="display:flex;gap:16px;margin-top:4px;font-size:0.68rem;color:var(--text-dim)">
        <span>尺寸约 ${r.s_mean}m</span><span>重量约 ${r.w_mean}kg</span><span>数据量: ${r.n}</span>
      </div>
      <div class="result-bar" style="width:${Math.min(100, r.prob * 1.5)}%;background:${i === 0 ? 'linear-gradient(90deg,#fdbf3a,#e5a820)' : i < 3 ? 'linear-gradient(90deg,#4fc3f7,#0288d1)' : 'linear-gradient(90deg,rgba(255,255,255,0.3),rgba(255,255,255,0.1))'}"></div>
    </div>
  `).join('') + '</div>';
}

// INPUT
document.getElementById('input-size').addEventListener('input', function() {
  document.getElementById('btn-predict').disabled = !this.value || !document.getElementById('input-weight').value;
});
document.getElementById('input-weight').addEventListener('input', function() {
  document.getElementById('btn-predict').disabled = !this.value || !document.getElementById('input-size').value;
});
document.getElementById('input-size').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('input-weight').focus(); });
document.getElementById('input-weight').addEventListener('keydown', function(e) { if (e.key === 'Enter') predict(); });
document.querySelectorAll('#source-chips .chip').forEach(chip => {
  chip.addEventListener('click', function() {
    document.querySelectorAll('#source-chips .chip').forEach(c => c.classList.remove('selected'));
    this.classList.add('selected');
  });
});
function fillExample(name) {
  const ex = EXAMPLES.find(e => e.label === name);
  if (ex) {
    document.getElementById('input-size').value = ex.size;
    document.getElementById('input-weight').value = ex.weight;
    document.getElementById('btn-predict').disabled = false;
    predict();
  }
}

// HISTORY
let history = JSON.parse(localStorage.getItem('hatch_history') || '[]');
function addToHistory(size, weight, topResult) {
  history.unshift({ size, weight, top: topResult.name, prob: topResult.prob, time: new Date().toLocaleString() });
  if (history.length > 50) history.pop();
  localStorage.setItem('hatch_history', JSON.stringify(history));
  if (document.getElementById('history-panel').classList.contains('open')) renderHistory();
}
function toggleHistory() {
  const panel = document.getElementById('history-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) renderHistory();
}
function renderHistory() {
  const panel = document.getElementById('history-panel');
  if (history.length === 0) {
    panel.innerHTML = '<p style="color:var(--text-dim);font-size:0.72rem;text-align:center;padding:8px">暂无记录</p>';
    return;
  }
  panel.innerHTML = history.map(h => `
    <div class="history-item">
      <span><strong>${h.top}</strong> ${h.prob}% · ${h.size}m / ${h.weight}kg</span>
      <span style="font-size:0.6rem;color:var(--text-dim)">${h.time.split(' ')[1] || h.time}</span>
    </div>
  `).join('') + '<button onclick="clearHistory()" style="width:100%;padding:6px;margin-top:4px;background:rgba(244,67,54,0.15);color:#f44336;border:1px solid rgba(244,67,54,0.3);border-radius:8px;font-size:0.7rem;cursor:pointer">清空历史</button>';
}
function clearHistory() { history = []; localStorage.setItem('hatch_history', '[]'); renderHistory(); }

// TABLE
let tableSortKey = 'n';
let tableSortDir = -1;
function renderTable() {
  const search = (document.getElementById('species-search').value || '').toLowerCase();
  const sizeFilter = document.getElementById('size-filter').value;
  let data = [...SPECIES_DATA];
  if (search) data = data.filter(s => s.name.includes(search));
  if (sizeFilter === 'small') data = data.filter(s => s.s_mean < 0.20);
  if (sizeFilter === 'medium') data = data.filter(s => s.s_mean >= 0.20 && s.s_mean < 0.35);
  if (sizeFilter === 'large') data = data.filter(s => s.s_mean >= 0.35 && s.s_mean < 0.50);
  if (sizeFilter === 'xlarge') data = data.filter(s => s.s_mean >= 0.50);
  data.sort((a, b) => { const av = typeof a[tableSortKey]==='string'?a[tableSortKey]:a[tableSortKey], bv = typeof b[tableSortKey]==='string'?b[tableSortKey]:b[tableSortKey]; return (typeof av==='string'?av.localeCompare(bv):av-bv)*tableSortDir; });
  document.getElementById('species-count').textContent = data.length;
  const maxW = Math.max(...data.map(s => s.w_mean), 1);
  const maxS = Math.max(...data.map(s => s.s_mean), 1);
  document.querySelector('#species-table tbody').innerHTML = data.map(s => `
    <tr>
      <td style="font-weight:700">${s.name}</td>
      <td>${s.s_mean.toFixed(3)} <span class="size-bar" style="width:${s.s_mean/maxS*100}px;background:linear-gradient(90deg,#fdbf3a,#e5a820)"></span></td>
      <td>${s.w_mean.toFixed(3)} <span class="weight-bar" style="width:${s.w_mean/maxW*100}px;background:linear-gradient(90deg,#4fc3f7,#0288d1)"></span></td>
      <td>${s.n}</td>
      <td style="font-size:0.7rem;color:var(--text-dim)">${s.s_min} ~ ${s.s_max}</td>
      <td style="font-size:0.7rem;color:var(--text-dim)">${s.w_min.toFixed(2)} ~ ${s.w_max.toFixed(2)}</td>
    </tr>
  `).join('');
}
function sortTable(key) { if (tableSortKey === key) tableSortDir *= -1; else { tableSortKey = key; tableSortDir = -1; } renderTable(); }

// TOAST
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// INIT
const totalN = SPECIES_DATA.reduce((s, x) => s + x.n, 0);
document.getElementById('total-species').textContent = SPECIES_DATA.length;
document.getElementById('total-data').textContent = totalN.toLocaleString();
renderHistory();
